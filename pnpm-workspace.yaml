# パッケージ公開から最低限経過させる分数 (10080 分 = 7 日)
# サプライチェーン攻撃のリスク軽減のため、公開直後のパッケージのインストールを遅延させる
minimumReleaseAge: 10080
# minimumReleaseAge の対象外とするパッケージ
# 自社管理パッケージおよびコアツールチェーンは即時インストールを許可する
minimumReleaseAgeExclude:
  # 自社パッケージ (Shiguredo)
  - sora-js-sdk
  - "@shiguredo/*"
  # Microsoft
  - typescript
  - "@typescript/*"
  # Preact
  - preact
  - preact-iso
  - "@preact/signals"
  # ビルドツールチェーン (Voidzero / Oxc)
  # vite-plus / vitest / oxfmt / oxlint は活発に更新されるため制限対象外とする
  - "@voidzero-dev/*"
  - vite-plus
  - "@vitest/*"
  - vitest
  - "@oxc-project/*"
  - "@oxfmt/*"
  - oxfmt
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxlint

# ビルド時に pre/post install スクリプトを実行するパッケージ
allowBuilds:
  esbuild: true

# ピア依存関係のバージョン互換性ルール
# vite/vitest は @voidzero-dev のエイリアスであり、パッケージが期待する semver 範囲を満たさないため上書きする
# typescript は 7.x 系を使用しているが、依存パッケージの peer dep が ^5.0.0 等で失敗するため上書きする
peerDependencyRules:
  allowedVersions:
    vite: ">=0.1.0"
    vitest: ">=0.1.0"
    typescript: ">=7.0.0"

# @duckdb/duckdb-wasm は 1.32.0 に固定する
# 1.33.1-dev34.0 以降は OPFS 永続化が壊れる (duckdb/duckdb-wasm#2192)
# 修正が npm latest に入るまで更新しないこと
overrides:
  "@duckdb/duckdb-wasm": "1.32.0"
