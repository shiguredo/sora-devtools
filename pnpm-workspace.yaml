# パッケージ公開から最低限経過させる分数 (10080 分 = 7 日)
# サプライチェーン攻撃のリスク軽減のため、公開直後のパッケージのインストールを遅延させる
minimumReleaseAge: 10080
# minimumReleaseAge の対象外とするパッケージ
# 自社管理パッケージおよびコアツールチェーンは即時インストールを許可する
minimumReleaseAgeExclude:
  # 自社パッケージ (Shiguredo)
  - sora-js-sdk
  - "@shiguredo/*"
  # Microsoft
  - typescript
  - "@typescript/*"
  # Preact
  - preact
  - preact-iso
  - "@preact/signals"
  # ビルドツールチェーン (Voidzero / Oxc)
  # vite-plus / vitest / oxfmt / oxlint は活発に更新されるため制限対象外とする
  - "@voidzero-dev/*"
  - vite-plus
  - "@vitest/*"
  - vitest
  - "@oxc-project/*"
  - "@oxfmt/*"
  - oxfmt
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxlint-tsgolint
  - oxlint
  - "@preact/signals-core@1.14.5"

# ビルド時に pre/post install スクリプトを実行するパッケージ
allowBuilds:
  esbuild: true

# ピア依存関係のバージョン互換性ルール
# vite/vitest は catalog で @voidzero-dev のエイリアスに固定しており、
# パッケージが期待する semver 範囲を満たさないため allowAny で警告を抑止する
# typescript は 7.x 系を使用しているが、依存パッケージの peer dep が ^5.0.0 等で失敗するため上書きする
peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
    typescript: ">=7.0.0"
  allowAny:
    - vite
    - vitest

# @duckdb/duckdb-wasm は npm next の 1.33.1-dev110.0 に固定する
# npm latest の 1.33.1-dev57.0 は OPFS 永続化が壊れている (duckdb/duckdb-wasm#2192)
# #2192 の修正は 1.33.1-dev61.0 以降。latest がそこへ進むまで next を使う
# 1 MB 超の OPFS moveFile 破損 (duckdb/duckdb-wasm#2248) は未修正
overrides:
  "@duckdb/duckdb-wasm": "1.33.1-dev110.0"
  vite@*: "catalog:"
  vitest@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
