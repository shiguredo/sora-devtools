name: Deploy sora-devtools to Cloudflare R2

on:
  push:
    branches: ["develop", "master"]

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1.10.0
        with:
          node-version: "26"
      - run: vp install --frozen-lockfile
      # デプロイするビルドでは Sessions 機能を有効化する
      - run: vp build
        env:
          VITE_ENABLE_SESSIONS: "true"
      # R2 へのアップロード
      - name: Configure AWS CLI for R2
        run: |
          aws configure set region auto
      # ブランチが master の場合のみデプロイする
      - name: Upload to R2 (Production)
        if: github.ref == 'refs/heads/master'
        run: |
          aws s3 sync ./dist/ s3://sora-devtools/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete \
            --cache-control "public, max-age=3600"
      - name: Upload to R2 (Canary)
        # ブランチが develop の場合のみデプロイする
        if: github.ref == 'refs/heads/develop'
        run: |
          aws s3 sync ./dist/ s3://sora-devtools-canary/ \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com \
            --delete \
            --cache-control "public, max-age=300"
