name: e2e-test

on:
  push:
    branches:
      - develop
      - "feature/*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "releases/*"

jobs:
  e2e-test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # browser: ["chromium", "firefox", "webkit"]
        browser: ["chromium"]
    env:
      E2E_TEST_SORA_SIGNALING_URL: ${{ secrets.TEST_SIGNALING_URL }}
      E2E_TEST_SORA_CHANNEL_ID_PREFIX: ${{ secrets.TEST_CHANNEL_ID_PREFIX }}
      E2E_TEST_ACCESS_TOKEN: ${{ secrets.TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: vp install
      # E2E では Sessions 機能を有効化して検証する
      - run: vp build
        env:
          VITE_ENABLE_SESSIONS: "true"
      - run: vp exec playwright install ${{ matrix.browser }} --with-deps
      - run: vp exec playwright test --project=${{ matrix.browser }}
        env:
          VITE_SORA_CHANNEL_ID_SUFFIX: _26

  slack_notify:
    needs:
      - e2e-test
    permissions:
      actions: read
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-devtools
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
