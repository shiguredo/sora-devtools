name: ci

on:
  push:
    branches:
      - master
      - develop
      - "feature/*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "releases/*"
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: ".node-version"
          run-install: true
      - run: vp check
      # CI では Sessions 機能を有効化してビルド・テストする
      - run: vp build
        env:
          VITE_ENABLE_SESSIONS: "true"
      - run: vp test run
        env:
          VITE_ENABLE_SESSIONS: "true"
      # Sessions 無効ビルドが成功し、DuckDB-Wasm / Apache Arrow / uPlot /
      # Sessions ページ関連のアセットが含まれないことを検証する
      - run: rm -rf dist && vp build
        env:
          VITE_ENABLE_SESSIONS: "false"
      - run: |
          if [ ! -d dist/assets ]; then
            echo "dist/assets is missing"
            exit 1
          fi
          forbidden=$(ls dist/assets | grep -Ei 'duckdb|apache-arrow|uplot|Sessions|sessionDatabase' || true)
          if [ -n "$forbidden" ]; then
            echo "Sessions-disabled build must not contain Sessions-related assets:"
            echo "$forbidden"
            exit 1
          fi
      # 無効モードでも unit test を実行し、ラッパーの no-op 契約を検証する
      # （有効モードでは test.skipIf で該当テストが skip されるため）
      - run: vp test run
        env:
          VITE_ENABLE_SESSIONS: "false"

  slack_notify:
    needs:
      - ci
    permissions:
      actions: read
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: always()
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: sora-devtools
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
